[package]
name = "server"
version = "1.0.1"
edition = "2024"

[dependencies]
audiopus = { version = "0.2.0", features = ["encoder"] }
bincode = "1.3.3"
cpal = "0.17.1"
# [FIX] Enable 'std' and default features for Slint to compile correctly.
# We will still force software rendering via environment variable in code.
slint = { version = "1.9.1", features = ["compat-1-2", "renderer-software"] }
image = "0.25.9"
mdns-sd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
tray-icon = "0.21.3"
socket2 = "0.5.8"
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_Graphics_Gdi"] }
crossbeam-channel = "0.5.15"