name: Release Build

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Server
        run: |
          cd server
          cargo build --release
      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: as2p-server
          path: server/target/release/server.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2

      # The release signing key is not in the repository. It is restored here from
      # GitHub Actions secrets; see RELEASING.md for how to rotate or recover it.
      - name: Restore release signing key
        env:
          AS2P_KEYSTORE_B64: ${{ secrets.AS2P_KEYSTORE_B64 }}
          AS2P_KEYSTORE_PASSWORD: ${{ secrets.AS2P_KEYSTORE_PASSWORD }}
          AS2P_KEY_ALIAS: ${{ secrets.AS2P_KEY_ALIAS }}
          AS2P_KEY_PASSWORD: ${{ secrets.AS2P_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          echo "$AS2P_KEYSTORE_B64" | base64 -d > app/as2p-release.keystore
          {
            echo "storeFile=app/as2p-release.keystore"
            echo "storePassword=$AS2P_KEYSTORE_PASSWORD"
            echo "keyAlias=$AS2P_KEY_ALIAS"
            echo "keyPassword=$AS2P_KEY_PASSWORD"
          } > keystore.properties

      - name: Build Android APK
        run: |
          cd android
          gradle assembleRelease

      - name: Verify APK signature
        env:
          EXPECTED_CERT_SHA256: e1348351ddfb7ae1386ccd822fbbfb90926da7bcea0a5ef758b28e9e2e29d059
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -oE 'SHA-256 digest: [0-9a-f]+' | awk '{print $3}')
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signed with unexpected certificate: $ACTUAL"
            exit 1
          fi
          echo "APK signed with the expected release certificate."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: as2p-app
          path: android/app/build/outputs/apk/release/app-release.apk

  create-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Server
        uses: actions/download-artifact@v4
        with:
          name: as2p-server
      
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: as2p-app

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            server.exe
            app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
